<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPA & CGPA Suite | CSE Tools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <header class="glass-panel sticky top-0 z-40 px-6 py-3.5 flex justify-between items-center border-b border-slate-800">
    <a href="../index.html" class="flex items-center space-x-2 text-indigo-400 hover:text-indigo-300 text-sm font-medium">
      <i class="fa-solid fa-arrow-left"></i> <span>Back to Main Portal</span>
    </a>
    <span class="text-xs text-slate-400 font-mono">Public Tool</span>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-8 space-y-6">
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">Academic GPA Calculator</h1>
      <p class="text-xs text-slate-400">Calculate Semester GPA (sGPA), Yearly GPA (yGPA), and Cumulative CGPA instantly.</p>
    </div>

    <div class="glass-panel rounded-2xl p-5 custom-shadow space-y-4">
      <div id="courseRows" class="space-y-3">
        <div class="grid grid-cols-3 gap-3 course-row">
          <input type="text" placeholder="Course Name (e.g. Data Structures)" class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200">
          <input type="number" step="0.5" placeholder="Credit (e.g. 3.0)" class="credit-input bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200">
          <input type="number" step="0.01" placeholder="Grade Point (e.g. 3.75)" class="gpa-input bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200">
        </div>
      </div>

      <div class="flex flex-wrap gap-2 pt-2">
        <button onclick="addRow()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3.5 py-2 rounded-xl border border-slate-700 transition">
          <i class="fa-solid fa-plus mr-1"></i> Add Course
        </button>
        <button onclick="calculateGpa()" class="text-xs bg-indigo-600 hover:bg-indigo-500 font-semibold px-5 py-2 rounded-xl transition shadow-lg shadow-indigo-600/20">
          Calculate sGPA / CGPA
        </button>
      </div>

      <div id="resultCard" class="hidden mt-4 p-4 rounded-xl bg-indigo-950/40 border border-indigo-800/60 flex justify-between items-center">
        <div>
          <span class="text-xs text-indigo-300 font-medium block">Calculated Result:</span>
          <span id="resGpa" class="text-2xl font-bold text-white font-mono">0.00</span>
        </div>
        <span id="resCredits" class="text-xs text-slate-400 font-mono"></span>
      </div>
    </div>
  </main>

  <script>
    function addRow() {
      const container = document.getElementById("courseRows");
      const div = document.createElement("div");
      div.className = "grid grid-cols-3 gap-3 course-row";
      div.innerHTML = `
        <input type="text" placeholder="Course Name" class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200">
        <input type="number" step="0.5" placeholder="Credit" class="credit-input bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200">
        <input type="number" step="0.01" placeholder="Grade Point" class="gpa-input bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200">
      `;
      container.appendChild(div);
    }

    function calculateGpa() {
      const credits = document.querySelectorAll(".credit-input");
      const gpas = document.querySelectorAll(".gpa-input");
      let totalQualityPoints = 0;
      let totalCredits = 0;

      for (let i = 0; i < credits.length; i++) {
        const c = parseFloat(credits[i].value);
        const g = parseFloat(gpas[i].value);
        if (!isNaN(c) && !isNaN(g)) {
          totalQualityPoints += c * g;
          totalCredits += c;
        }
      }

      if (totalCredits > 0) {
        const finalGpa = (totalQualityPoints / totalCredits).toFixed(2);
        document.getElementById("resGpa").innerText = `${finalGpa} / 4.00`;
        document.getElementById("resCredits").innerText = `Total Credits: ${totalCredits}`;
        document.getElementById("resultCard").classList.remove("hidden");
      }
    }
  </script>
</body>
</html>
